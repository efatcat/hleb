<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HLEB GAME — профиль автора</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0a;
    --surface:#141414;
    --surface-2:#1a1a1a;
    --text:#fafafa;
    --muted:#8b8b8b;
    --muted-2:#666;
    --line:#262626;
    --line-2:#3a3a3a;
    --accent:#fafafa;
    --accent-soft:#1f1f1f;
    --radius:16px;
    --radius-sm:10px;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Unbounded',-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
    min-height:100vh;
  }
  a{color:inherit;text-decoration:none}
  img{max-width:100%;display:block}
  .container{max-width:1140px;margin:0 auto;padding:0 24px}

  /* ---------- Nav ---------- */
  .nav{
    position:sticky;top:0;z-index:50;
    background:rgba(10,10,10,.82);
    backdrop-filter:saturate(180%) blur(14px);
    -webkit-backdrop-filter:saturate(180%) blur(14px);
    border-bottom:1px solid var(--line);
  }
  .nav__inner{
    display:flex;align-items:center;justify-content:space-between;
    height:80px;gap:24px;
  }
  .logo{
    display:flex;align-items:center;gap:12px;
    font-weight:700;font-size:22px;letter-spacing:-.02em;
    flex-shrink:0;
  }
  .logo__mark{
    width:46px;height:46px;border-radius:11px;
    background:var(--text);overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    color:#0a0a0a;font-weight:800;font-size:20px;
  }
  .logo__mark img{width:100%;height:100%;object-fit:contain;padding:3px;background:#0a0a0a}
  .nav__right{display:flex;align-items:center;gap:14px;flex-shrink:0}
  .nav__back{
    display:inline-flex;align-items:center;gap:8px;
    font-size:13px;color:var(--muted);font-weight:500;
    transition:color .2s;cursor:pointer;
  }
  .nav__back:hover{color:var(--text)}
  .nav__back svg{transition:transform .2s}
  .nav__back:hover svg{transform:translateX(-3px)}

  /* ---------- Hero ---------- */
  .hero{
    position:relative;
    padding:80px 0 48px;
    overflow:hidden;
    text-align:center;
    margin-bottom:0;
  }
  .hero__banner{
    position:absolute;inset:0;
    background-size:cover;
    background-position:center top;
    background-repeat:no-repeat;
    opacity:0;
    transition:opacity .6s ease;
    z-index:0;
  }
  .hero__banner.visible{opacity:1}
  .hero__banner::after{
    content:"";position:absolute;inset:0;
    background:
      linear-gradient(180deg, rgba(10,10,10,.55) 0%, rgba(10,10,10,.85) 60%, var(--bg) 100%);
  }
  .hero::before{
    content:"";position:absolute;inset:0;
    background:radial-gradient(60% 50% at 50% 0%, rgba(255,255,255,.06), transparent 70%);
    pointer-events:none;z-index:1;
  }
  .hero > .container{position:relative;z-index:2}
  .hero__avatar{
    width:140px;height:140px;border-radius:50%;
    margin:0 auto 24px;
    background:var(--surface);
    border:1px solid var(--line-2);
    display:flex;align-items:center;justify-content:center;
    font-size:52px;color:var(--muted);
    overflow:hidden;position:relative;
    box-shadow:0 10px 30px rgba(0,0,0,.6);
  }
  .hero__avatar img{width:100%;height:100%;object-fit:cover}
  .hero__name{
    font-size:clamp(36px,6vw,64px);
    font-weight:800;letter-spacing:-.035em;
    line-height:1.05;
    margin-bottom:14px;
    text-shadow:0 2px 20px rgba(0,0,0,.6);
  }
  .hero__badge{
    display:inline-flex;align-items:center;gap:8px;
    background:rgba(20,20,20,.75);
    backdrop-filter:blur(10px);
    border:1px solid var(--line);
    padding:6px 14px;border-radius:999px;
    font-size:12px;color:var(--muted);font-weight:500;
    margin-bottom:20px;
  }
  .hero__badge__dot{
    width:7px;height:7px;border-radius:50%;
    background:#22c55e;
    box-shadow:0 0 0 3px rgba(34,197,94,.2);
  }
  .hero__bio{
    font-size:15px;color:var(--muted);
    max-width:560px;margin:0 auto;
    line-height:1.65;
  }

  /* ---------- Section ---------- */
  .sec{padding:24px 0 96px}
  .sec__head{
    display:flex;align-items:flex-end;justify-content:space-between;
    margin-bottom:28px;flex-wrap:wrap;gap:12px;
  }
  .sec__head h2{
    font-size:22px;font-weight:700;letter-spacing:-.02em;
    display:flex;align-items:center;gap:12px;
  }
  .sec__count{
    font-size:12px;color:var(--muted);
    background:var(--surface);border:1px solid var(--line);
    padding:3px 9px;border-radius:999px;font-weight:600;
  }
  .sec__head .link{
    font-size:14px;color:var(--muted);font-weight:500;
  }

  /* ---------- Grid ---------- */
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:18px}

  /* ---------- Card ---------- */
  .card{
    background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);overflow:hidden;
    transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    cursor:pointer;
    display:flex;flex-direction:column;
    position:relative;
    animation:fadeUp .5s ease both;
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .card:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--line-2)}
  .card__cover{
    aspect-ratio:1/1;position:relative;overflow:hidden;
    display:flex;align-items:flex-end;padding:14px;
    background:linear-gradient(135deg,#1e1e1e,#0f0f0f);
  }
  .card__cover img{
    position:absolute;inset:0;width:100%;height:100%;
    object-fit:cover;
    transition:transform .5s ease;
  }
  .card:hover .card__cover img{transform:scale(1.04)}
  .card__cover::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg, transparent 45%, rgba(0,0,0,.8));
    z-index:1;
  }
  .card__fallback{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    font-size:44px;opacity:.5;z-index:0;
  }
  .card__title{
    position:relative;z-index:2;color:#fff;
    font-weight:700;font-size:14px;letter-spacing:-.01em;
    line-height:1.3;
  }
  .card__body{
    padding:12px 14px 14px;
    display:flex;align-items:center;justify-content:space-between;
    gap:10px;
  }
  .card__tag{
    font-size:11px;color:var(--muted);font-weight:500;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .card__play{
    font-size:12px;font-weight:700;color:var(--text);
    flex-shrink:0;
    display:flex;align-items:center;gap:4px;
  }

  /* ---------- Skeleton ---------- */
  @keyframes shimmer{
    0%{background-position:-468px 0}
    100%{background-position:468px 0}
  }
  .sk{
    background:#141414;
    background-image:linear-gradient(
      90deg,
      #141414 0px,
      #1e1e1e 40px,
      #262626 80px,
      #1e1e1e 120px,
      #141414 160px
    );
    background-size:468px 100%;
    background-repeat:no-repeat;
    animation:shimmer 1.4s linear infinite;
    border-radius:10px;
  }
  .sk-circle{border-radius:50%}
  .sk-avatar{width:140px;height:140px;margin:0 auto 24px}
  .sk-name{width:260px;height:44px;margin:0 auto 14px;border-radius:12px}
  .sk-badge{width:200px;height:26px;margin:0 auto 20px;border-radius:999px}
  .sk-bio{width:340px;height:14px;margin:0 auto;border-radius:8px}
  .sk-head{width:120px;height:26px;margin-bottom:28px;border-radius:8px}
  .sk-card{background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);overflow:hidden}
  .sk-cover{width:100%;aspect-ratio:1/1;border-radius:0}
  .sk-body{padding:12px 14px 14px}
  .sk-line{width:70%;height:12px;margin-bottom:8px;border-radius:6px}
  .sk-line.short{width:40%;height:10px;margin-bottom:0}
  .skeleton-wrap{display:none}
  .skeleton-wrap.visible{display:block}
  .real-wrap{display:none}
  .real-wrap.visible{display:block}

  /* ---------- Empty ---------- */
  .empty{
    text-align:center;padding:60px 0;
    color:var(--muted);font-size:14px;
    grid-column:1/-1;
  }

  /* ---------- Footer ---------- */
  .foot{
    border-top:1px solid var(--line);
    padding:28px 0;text-align:center;
    color:var(--muted);font-size:12px;
  }
  .foot strong{color:var(--text);font-weight:600}

  /* ---------- Responsive ---------- */
  @media (max-width:1100px){.grid{grid-template-columns:repeat(4,1fr)}}
  @media (max-width:960px){
    .grid{grid-template-columns:repeat(3,1fr)}
    .hero{padding:56px 0 40px}
    .hero__avatar{width:120px;height:120px;font-size:44px}
  }
  @media (max-width:860px){
    .nav__inner{height:72px}
    .logo{font-size:20px}
    .logo__mark{width:42px;height:42px}
  }
  @media (max-width:640px){
    .grid{grid-template-columns:repeat(2,1fr)}
    .sec__head h2{font-size:18px}
    .hero__name{font-size:clamp(28px,8vw,44px)}
    .hero__bio{font-size:14px}
  }
  @media (max-width:420px){
    .container{padding:0 16px}
    .grid{grid-template-columns:1fr}
    .logo{font-size:18px}
    .logo__mark{width:38px;height:38px}
    .hero__avatar{width:100px;height:100px;font-size:36px}
  }
</style>
</head>
<body>

<!-- ====== NAV ====== -->
<header class="nav">
  <div class="container nav__inner">
    <a href="/hleb/index.html" class="logo">
      <span class="logo__mark"><img src="/hleb/LOGOhg.png" alt="" onerror="this.parentElement.textContent='H'"></span>
      HLEB GAME
    </a>
    <div class="nav__right">
      <a href="/hleb/index.html" class="nav__back">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        На главную
      </a>
    </div>
  </div>
</header>

<!-- ====== HERO (skeleton) ====== -->
<div class="skeleton-wrap visible" id="skeleton">
  <section class="hero">
    <div class="container">
      <div class="sk sk-circle sk-avatar"></div>
      <div class="sk sk-name"></div>
      <div class="sk sk-badge"></div>
      <div class="sk sk-bio"></div>
    </div>
  </section>
  <section class="sec">
    <div class="container">
      <div class="sk sk-head"></div>
      <div class="grid" id="skGrid">
        <div class="sk-card">
          <div class="sk sk-cover"></div>
          <div class="sk-body"><div class="sk sk-line"></div><div class="sk sk-line short"></div></div>
        </div>
        <div class="sk-card">
          <div class="sk sk-cover"></div>
          <div class="sk-body"><div class="sk sk-line"></div><div class="sk sk-line short"></div></div>
        </div>
        <div class="sk-card">
          <div class="sk sk-cover"></div>
          <div class="sk-body"><div class="sk sk-line"></div><div class="sk sk-line short"></div></div>
        </div>
        <div class="sk-card">
          <div class="sk sk-cover"></div>
          <div class="sk-body"><div class="sk sk-line"></div><div class="sk sk-line short"></div></div>
        </div>
        <div class="sk-card">
          <div class="sk sk-cover"></div>
          <div class="sk-body"><div class="sk sk-line"></div><div class="sk sk-line short"></div></div>
        </div>
      </div>
    </div>
  </section>
</div>

<!-- ====== REAL ====== -->
<div class="real-wrap" id="real">
  <section class="hero" id="hero">
    <div class="hero__banner" id="heroBanner"></div>
    <div class="container">
      <div class="hero__avatar" id="authorAvatar">👤</div>
      <h1 class="hero__name" id="authorName">Автор</h1>
      <div class="hero__badge">
        <span class="hero__badge__dot"></span>
        <span id="authorBadge">создатель ИИ-игр</span>
      </div>
      <p class="hero__bio" id="authorBio"></p>
    </div>
  </section>

  <section class="sec">
    <div class="container">
      <div class="sec__head">
        <h2>Игры <span class="sec__count" id="gamesCount">0</span></h2>
        <span class="link">от автора</span>
      </div>
      <div class="grid" id="gamesGrid"></div>
      <div class="empty" id="emptyState" style="display:none">У автора пока нет игр</div>
    </div>
  </section>
</div>

<!-- ====== FOOTER ====== -->
<footer class="foot">
  <div class="container">
    © 2026 <strong>HLEB GAME</strong> — каталог ИИ-игр.
  </div>
</footer>

<script>
(function(){
'use strict';

const ROOT = '/hleb';
const AUTHORS_DIR = ROOT + '/avtor/authors';
const GAMEX_DIR   = ROOT + '/avtor/gamexes';

const skeleton = document.getElementById('skeleton');
const realWrap = document.getElementById('real');

function getSlug(){
  const parts = location.pathname.split('/').filter(Boolean);
  const last = parts[parts.length - 1] || '';
  if(last === 'avtor' || last === 'index.html' || last === 'hleb'){
    return new URLSearchParams(location.search).get('author') || '';
  }
  return last.replace(/\.html$/i,'');
}

function parseAuthorx(text){
  const o = {};
  text.split(/\r?\n/).forEach(raw=>{
    const line = raw.trim();
    if(!line || line.startsWith('#')) return;
    const i = line.indexOf(':');
    if(i === -1) return;
    o[line.slice(0,i).trim().toLowerCase()] = line.slice(i+1).trim();
  });
  return o;
}

function parseGamex(text){
  const g = { title:'', url:'', image:'', fallbackIcon:'🎮', authors:[] };
  const aMap = {};
  text.split(/\r?\n/).forEach(raw=>{
    const line = raw.trim();
    if(!line || line.startsWith('#')) return;
    const i = line.indexOf(':');
    if(i === -1) return;
    const key = line.slice(0,i).trim().toLowerCase();
    const val = line.slice(i+1).trim();
    if(!val) return;
    if(key==='title') g.title = val;
    else if(key==='url') g.url = val;
    else if(key==='image') g.image = val;
    else if(key==='icon') g.fallbackIcon = val;
    else if(/^author\d*$/.test(key)){
      const n=(key.match(/\d+/)||[1])[0]|0||1;
      (aMap[n]||={}).slug = val;
    } else if(/^authorpage\d*$/.test(key)){
      const n=(key.match(/\d+/)||[1])[0]|0||1;
      (aMap[n]||={}).page = val;
    }
  });
  Object.keys(aMap).map(Number).sort((a,b)=>a-b).forEach(n=>{
    if(aMap[n].slug) g.authors.push(aMap[n]);
  });
  if(!g.image) g.image = null;
  return (g.title && g.url) ? g : null;
}

async function loadAuthor(slug){
  try{
    const r = await fetch(`${AUTHORS_DIR}/${slug}.authorx`, {cache:'no-store'});
    if(!r.ok) return null;
    return parseAuthorx(await r.text());
  }catch(e){ return null; }
}

async function loadAuthorGames(slug){
  let files = [];
  try{
    const r = await fetch(`${GAMEX_DIR}/index.json`, {cache:'no-store'});
    if(r.ok) files = await r.json();
  }catch(e){}
  if(!Array.isArray(files) || !files.length) return [];

  const results = await Promise.all(files.map(async name=>{
    const clean = String(name).replace(/\.gamex$/i,'').trim();
    if(!clean) return null;
    try{
      const r = await fetch(`${GAMEX_DIR}/${clean}.gamex`, {cache:'no-store'});
      if(!r.ok) return null;
      const g = parseGamex(await r.text());
      if(!g) return null;
      if(!g.authors.some(a=>a.slug === slug)) return null;
      return g;
    }catch(e){ return null; }
  }));
  return results.filter(Boolean);
}

/* ✅ Рендер профиля с баннером */
function renderAuthor(a, slug){
  const nameEl  = document.getElementById('authorName');
  const badgeEl = document.getElementById('authorBadge');
  const bioEl   = document.getElementById('authorBio');
  const avEl    = document.getElementById('authorAvatar');
  const banner  = document.getElementById('heroBanner');

  nameEl.textContent = a.name || slug;
  badgeEl.textContent = a.badge || 'создатель ИИ-игр';

  if(a.bio){
    bioEl.textContent = a.bio;
    bioEl.style.display = '';
  }else{
    bioEl.style.display = 'none';
  }

  if(a.avatar){
    avEl.innerHTML = `<img src="${a.avatar}" alt="${a.name||slug}">`;
  }else{
    avEl.textContent = '👤';
  }

  if(a.banner){
    banner.style.backgroundImage = `url('${a.banner}')`;
    banner.classList.add('visible');
  }

  document.title = `${a.name || slug} — HLEB GAME`;
}

/* ✅ Карточка игры: автор берётся из профиля, а не slug */
function buildCard(g, i, authorName){
  const card = document.createElement('article');
  card.className = 'card';
  card.style.animationDelay = `${Math.min(i*0.05,0.5)}s`;

  const cover = document.createElement('div');
  cover.className = 'card__cover';

  if(g.image){
    const img = document.createElement('img');
    img.src = g.image; img.alt = g.title; img.loading = 'lazy';
    img.onerror = ()=>{ img.remove(); cover.insertAdjacentHTML('afterbegin',`<div class="card__fallback">${g.fallbackIcon}</div>`); };
    cover.appendChild(img);
  }else{
    cover.insertAdjacentHTML('afterbegin',`<div class="card__fallback">${g.fallbackIcon}</div>`);
  }

  const title = document.createElement('h3');
  title.className = 'card__title';
  title.textContent = g.title;
  cover.appendChild(title);

  const body = document.createElement('div');
  body.className = 'card__body';

  const tag = document.createElement('span');
  tag.className = 'card__tag';
  // Подпись автора — имя из профиля; если авторов несколько, перечисляем имена
  tag.textContent = authorName || '';

  const play = document.createElement('span');
  play.className = 'card__play';
  play.textContent = 'Играть →';

  body.append(tag, play);
  card.append(cover, body);
  card.onclick = ()=>{
    if(g.url && g.url !== '#') window.open(g.url,'_blank','noopener,noreferrer');
  };
  return card;
}

function renderGames(games, authorName){
  const grid = document.getElementById('gamesGrid');
  const empty = document.getElementById('emptyState');
  const count = document.getElementById('gamesCount');
  grid.innerHTML = '';
  count.textContent = games.length;

  if(!games.length){
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  games.forEach((g,i)=> grid.appendChild(buildCard(g,i,authorName)));
}

function showReal(){
  skeleton.classList.remove('visible');
  realWrap.classList.add('visible');
}
function showSkeleton(){
  skeleton.classList.add('visible');
  realWrap.classList.remove('visible');
}

(async function init(){
  const slug = getSlug();

  if(!slug){
    showReal();
    document.getElementById('authorName').textContent = 'Автор не найден';
    document.getElementById('authorBadge').textContent = 'нет имени в URL';
    document.getElementById('authorBio').textContent = 'В URL нет имени автора. Пример: /avtor/cactusini';
    document.getElementById('gamesGrid').innerHTML =
      '<div class="empty">У автора пока нет игр</div>';
    return;
  }

  showSkeleton();

  const minDelay = new Promise(res => setTimeout(res, 400));
  const [author, games] = await Promise.all([
    loadAuthor(slug),
    loadAuthorGames(slug),
    minDelay
  ]);

  if(!author){
    showReal();
    document.getElementById('authorName').textContent = slug;
    document.getElementById('authorBadge').textContent = 'профиль не найден';
    document.getElementById('authorBio').textContent = `Файл avtor/authors/${slug}.authorx не найден`;
    document.getElementById('gamesGrid').innerHTML =
      '<div class="empty">У автора пока нет игр</div>';
    document.getElementById('gamesCount').textContent = '0';
    return;
  }

  renderAuthor(author, slug);

  // ✅ В карточках показываем имя автора из профиля, а не slug
  const displayName = author.name || slug;
  renderGames(games, displayName);

  showReal();
})();
})();
</script>
</body>
</html>
